name: npm publish

# Publish to npm when a v* tag is pushed (e.g. git tag v0.3.0 && git push --tags).
# Uses npm Trusted Publishing (OIDC): no tokens stored anywhere. Requires the
# package's Trusted Publishers entry on npmjs.com (set once after first publish).
on:
  push:
    tags: ["v*"]

permissions:
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - run: npm publish --access public --provenance
